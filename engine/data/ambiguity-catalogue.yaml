  - number: 10
    name: "schwa /ə/ — the unstressed vowel"
    description: "The single most common vowel in English: any of a/e/i/o/u when unstressed becomes ə."
    rationale: >
      Schwa /ə/ is the rest position of the human mouth — the vowel
      every unstressed syllable reduces to. English spells it with all
      five vowel letters depending on the word's history: 'a' in about,
      'e' in taken, 'i' in pencil, 'o' in lemon, 'u' in circus. Phase 10
      unifies them all under one IPA codepoint: U+0259 ə.

      This is the project's first non-Latin grapheme. The Nayana font
      will render U+0259 with a custom shape (two horizontal strokes
      at the baseline — the natural extension of the vowel-marker
      stroke that already runs under every Latin vowel in ss01). Until
      the font ships that glyph, Comic Neue falls back to its default
      "turned e" — visually rough but the data is correct, and IPA-aware
      tools (TTS, linguistic software) will read /ə/ correctly because
      the codepoint is the canonical IPA schwa.

      This is the project's first stress-aware phoneme rule. The rules
      target ARPAbet AH0 (unstressed AH) specifically, NOT AH1 or AH2
      (stressed /ʌ/). So 'about' /əˈbaʊt/ → 'əbaut' while 'cup' /kʌp/
      stays as 'kup'. The engine's applyRuleToPairs gained a small
      branch: rules whose phoneme ends in a digit match exactly,
      without stripping stress.

      Pedagogical impact: schwa is the most frequent vowel in English
      (and many other languages). Marking it explicitly is what turns
      Nayana from "English with cleaner spelling" into "writing that
      reveals what was always being said." 'the' /ðə/ becomes 'thə',
      'about' becomes 'əbaut', 'banana' becomes 'bənanə'.
    rules:
      - name: "a→ə (when /ə/)"
        phoneme: "AH0"
        from: "a"
        to: "ə"
        examples:
          - { before: "about",   after: "əbaut" }
          - { before: "around",  after: "əraund" }
          - { before: "sofa",    after: "soufə" }
        exceptions:
          - { word: "cat",   reason: "a is /AE/, not /AH0/" }
          - { word: "face",  reason: "a is /EY/" }

      - name: "e→ə (when /ə/)"
        phoneme: "AH0"
        from: "e"
        to: "ə"
        examples:
          - { before: "taken",   after: "teikən" }
          - { before: "open",    after: "oupən" }
          - { before: "the",     after: "thə" }
        exceptions:
          - { word: "bed",  reason: "e is /EH/, not /AH0/" }
          - { word: "be",   reason: "e is /IY/" }

      - name: "i→ə (when /ə/)"
        phoneme: "AH0"
        from: "i"
        to: "ə"
        examples:
          - { before: "pencil",  after: "pensəl" }
          - { before: "animal",  after: "anəməl" }
          - { before: "cousin",  after: "kuzən" }
        exceptions:
          - { word: "it",   reason: "i is /IH/" }
          - { word: "ski",  reason: "i is /IY/" }

      - name: "o→ə (when /ə/)"
        phoneme: "AH0"
        from: "o"
        to: "ə"
        examples:
          - { before: "lemon",   after: "leməN" }
          - { before: "wagon",   after: "wagən" }
          - { before: "reason",  after: "riːzən" }
        exceptions:
          - { word: "on",   reason: "o is /AA/" }
          - { word: "go",   reason: "o is /OW/" }

      - name: "u→ə (when /ə/)"
        phoneme: "AH0"
        from: "u"
        to: "ə"
        examples:
          - { before: "circus",   after: "sirkəs" }
          - { before: "focus",    after: "foukəs" }
          - { before: "album",    after: "albəm" }
        exceptions:
          - { word: "cup",   reason: "u is /AH1/ (stressed)" }
          - { word: "run",   reason: "u is /AH1/" }
          - { word: "blue",  reason: "u is /UW/" }
