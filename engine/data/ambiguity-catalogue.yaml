      vowel-y at word end (happy, baby, money, key, lady). All converge
      on 'iː' — the IPA notation that pairs the close-front vowel with
      the length marker U+02D0. The 'ie' words (chief, field, brief)
      are handled by phase 6's silent-e plus the new bare-i rule —
      drop the e and lengthen the i.

