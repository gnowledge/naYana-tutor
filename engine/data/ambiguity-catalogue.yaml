  - number: 13
    name: "the short vowels and /dʒ/ — ɪ ʊ ɛ æ ʌ dʒ"
    description: "Five short vowels and one affricate. Resolves the iː/ɪ, uː/ʊ visual ambiguities once and for all, and gives /dʒ/ its own IPA digraph."
    rationale: >
      With the long vowels marked by length (iː uː) and schwa explicit
      (ə), the short vowels still wore the bare Latin letters that
      readers reduced to whichever sound context implied. Phase 13
      makes them visible:

        /ɪ/  ɪ  U+026A  small-cap I  bit, sit, fish, this
        /ʊ/  ʊ  U+028A  turned omega  book, foot, put, full
        /ɛ/  ɛ  U+025B  Latin epsilon bed, head, said
        /æ/  æ  U+00E6  ash ligature  cat, bat, black
        /ʌ/  ʌ  U+028C  turned v      cup, run, love, some

      Plus the voiced partner of phase 12's /tʃ/:

        /dʒ/ digraph  judge, age, gym, bridge

      Engine extension: the new "AH+" syntax matches AH at any stressed
      level (AH1 or AH2) without firing on schwa (AH0). Used so 'u → ʌ'
      and 'o → ʌ' fire on cup/run/love but not on the schwa cases
      handled by phase 10.

      Notable cleanup: this phase resolves three long-standing
      collisions / alignment quirks:
        - eat (iːt) vs it (ɪt) — long and short i now distinct
        - food (fuːd) vs foot (fʊt) — same for u
        - head → 'hɛd' (was 'had'), bread → 'brɛd', said → 'sɛd'
          (the phase-6 alignment quirk: Phonetisaurus aligned ea as
          e-silent + a-as-/EH/. Now a → ɛ when /EH/ catches the
          stranded a, giving the right phonetic spelling.)
        - said → 'sɛd', sighed → 'said' — phase 7's spurious
          collision is gone; said now reads correctly.

      Font glyph notes (recorded for the font ticket):
        - ʌ is the rotation of v. Same family of concern as ə
          (rotation of e). Nayana shape: a wedge with the opening
          downward and a longer base, distinct from v's open top.
        - dʒ digraph should ligate to a single Nayana glyph,
          matching the tʃ treatment.

    rules:
      # ----- /ɪ/ short-i -----
      - name: "i→ɪ (when /ɪ/)"
        phoneme: "IH"
        from: "i"
        to: "ɪ"
        examples:
          - { before: "bit",   after: "bɪt" }
          - { before: "sit",   after: "sɪt" }
          - { before: "fish",  after: "fɪʃ" }
          - { before: "this",  after: "ðɪs" }
        exceptions:
          - { word: "ski",  reason: "i is /IY/, handled by phase 9" }
          - { word: "it",   reason: "fires correctly here: it → ɪt" }

      # ----- /ʊ/ short-oo -----
      - name: "oo→ʊ (when /ʊ/)"
        phoneme: "UH"
        from: "oo"
        to: "ʊ"
        examples:
          - { before: "book",  after: "bʊk" }
          - { before: "foot",  after: "fʊt" }
          - { before: "good",  after: "gʊd" }
          - { before: "wood",  after: "wʊd" }
        exceptions:
          - { word: "food",  reason: "oo is /UW/ (handled by phase 8 → fuːd)" }

      - name: "u→ʊ (when /ʊ/)"
        phoneme: "UH"
        from: "u"
        to: "ʊ"
        examples:
          - { before: "put",   after: "pʊt" }
          - { before: "full",  after: "fʊll" }

      # ----- /ɛ/ short-e -----
      - name: "e→ɛ (when /ɛ/)"
        phoneme: "EH"
        from: "e"
        to: "ɛ"
        examples:
          - { before: "bed",   after: "bɛd" }
          - { before: "red",   after: "rɛd" }
          - { before: "met",   after: "mɛt" }
          - { before: "let",   after: "lɛt" }

      - name: "a→ɛ (when /ɛ/) — fixes the bread/head family"
        phoneme: "EH"
        from: "a"
        to: "ɛ"
        examples:
          - { before: "head",   after: "hɛd" }
          - { before: "bread",  after: "brɛd" }
          - { before: "many",   after: "mɛniː" }
        notes: >
          Phase 6 silent-e produces head→'had' because alignment is
          e}∅ a}EH1. This rule fixes it: the stranded a now becomes
          ɛ, giving 'hɛd'.

      - name: "ai→ɛ (when /ɛ/) — fixes said/sighed"
        phoneme: "EH"
        from: "ai"
        to: "ɛ"
        examples:
          - { before: "said",   after: "sɛd" }
          - { before: "again",  after: "əgɛn" }
        notes: >
          Phase 7's sighed→'said' collision is resolved: said now
          becomes sɛd, sighed stays as said.

      # ----- /æ/ short-a -----
      - name: "a→æ (when /æ/)"
        phoneme: "AE"
        from: "a"
        to: "æ"
        examples:
          - { before: "cat",     after: "kæt" }
          - { before: "bat",     after: "bæt" }
          - { before: "black",   after: "blæk" }
          - { before: "at",      after: "æt" }

      # ----- /ʌ/ stressed (cup, run, love) -----
      - name: "u→ʌ (when stressed /ʌ/)"
        phoneme: "AH+"
        from: "u"
        to: "ʌ"
        examples:
          - { before: "cup",   after: "kʌp" }
          - { before: "run",   after: "rʌn" }
          - { before: "sun",   after: "sʌn" }
          - { before: "jump",  after: "dʒʌmp" }

      - name: "o→ʌ (when stressed /ʌ/)"
        phoneme: "AH+"
        from: "o"
        to: "ʌ"
        examples:
          - { before: "love",  after: "lʌv" }
          - { before: "done",  after: "dʌn" }
          - { before: "some",  after: "sʌm" }
        exceptions:
          - { word: "go",    reason: "o is /OW/, phase 7 handles" }
          - { word: "lemon", reason: "o is /AH0/ (schwa, phase 10)" }

      # ----- /dʒ/ — the voiced partner of /tʃ/ -----
      - name: "j→dʒ"
        phoneme: "JH"
        from: "j"
        to: "dʒ"
        examples:
          - { before: "judge",  after: "dʒʌdʒ" }
          - { before: "jump",   after: "dʒʌmp" }

      - name: "g→dʒ (when /dʒ/)"
        phoneme: "JH"
        from: "g"
        to: "dʒ"
        examples:
          - { before: "age",     after: "eidʒ" }
          - { before: "page",    after: "peidʒ" }
          - { before: "large",   after: "lardʒ" }
          - { before: "magic",   after: "mædʒɪk" }
        exceptions:
          - { word: "go",   reason: "g is /G/ here" }
          - { word: "get",  reason: "g is /G/" }

      - name: "dg→dʒ"
        phoneme: "JH"
        from: "dg"
        to: "dʒ"
        examples:
          - { before: "judge",   after: "dʒʌdʒ" }
          - { before: "bridge",  after: "brɪdʒ" }
          - { before: "edge",    after: "ɛdʒ" }
