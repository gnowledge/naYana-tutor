  - number: 16
    name: "vowel completion — ɔː, ɑː, ɔɪ (and silent-l finally)"
    description: "The remaining English vowels get IPA glyphs. /ɔː/ for call/water/walk, /ɑː/ for father/lot/palm, /ɔɪ/ for boy/voice. Silent-l in walk/palm/half is now addressed via the al→ɔː/ɑː/æ rules."
    rationale: >
      After phase 15, the only English vowel phonemes still wearing
      bare Latin letters were /ɔː/ /ɑː/ /ɔɪ/ — the open-o, the
      cardinal a, and the oy diphthong. Phase 16 introduces all three
      and, in doing so, finally addresses silent-l: walk/palm/half
      align as al}AO1 / al}AA1 / al}AE1 (one grapheme to the vowel
      phoneme), so the rules that introduce the new vowels naturally
      drop the l along the way.

      Codepoints (canonical IPA):
        ɔ  U+0254  open o, with length marker → ɔː
        ɑ  U+0251  script a, with length marker → ɑː
        ɔɪ digraph (ɔ + ɪ from phase 13) — diphthong, no length marker
          (consistent with ai, ei, ou, au treatment from phases 5-7)

      After this phase, every English vowel phoneme that has an IPA
      glyph has been introduced. The remaining work is consonant
      cleanup (s→z, y→ɪ, ng-glyph) and the always-deferred future
      Nayana font ligatures.

      Two extra cleanup rules ride along since they share the
      "multi-letter -l grapheme" pattern: ol→ou for folk (where
      Phonetisaurus alignment groups o+l for /OW/), and ul→ʊ for
      could/would/should.

    rules:
      # ----- /ɔː/ open-o long -----
      - name: "a→ɔː (when /ɔː/)"
        phoneme: "AO"
        from: "a"
        to: "ɔː"
        examples:
          - { before: "call",   after: "kɔːl" }
          - { before: "all",    after: "ɔːl" }
          - { before: "water",  after: "wɔːtɚ" }
          - { before: "warm",   after: "wɔːrm" }

      - name: "ou→ɔː (when /ɔː/)"
        phoneme: "AO"
        from: "ou"
        to: "ɔː"
        examples:
