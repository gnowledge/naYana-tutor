      who, move), 'oo' (food, moon, room), 'u' (blue, true, rule), 'ew'
      (new, blew, knew), 'ou' (through, group, soup), and 'ui' (fruit,
      suit, juice). All six become 'uː' — the IPA notation that pairs
      the close-back vowel with the length marker U+02D0.

