  - number: 11
    name: "the th split — /θ/ and /ð/"
    description: "The two th sounds finally distinguished: th → θ in thin, math, breath; th → ð in this, that, mother, the."
    rationale: >
      English uses one digraph 'th' for two completely different phonemes:
      voiceless /θ/ (thin, math, three, thought) and voiced /ð/ (this,
      that, the, mother). Speakers don't think of them as different
      because the spelling collapses them, but they're as distinct as
      /s/ and /z/. Native speakers reliably produce both, but learners
      and dictionaries have to guess from context.
      Phase 11 uses two IPA codepoints: U+03B8 θ for the voiceless,
      U+00F0 ð for the voiced. Phonetisaurus aligns 'th' as a single
      grapheme to TH or DH — the rule simply branches on phoneme.

      'the' — the most common word in English — becomes 'ðə' (combining
      with phase 10's schwa). The visual change is unmistakable.

      Glyph design (separate font ticket): the Nayana font will draw
      ð with a delta-curve shape (curve over a closed circle) — easy
      to handwrite, visually distinct from anything else in the script.
      θ uses a custom shape too. Until the font ships, Comic Neue's
      fallback renders both; data layer is canonical IPA either way.
    rules:
      - name: "th→θ (voiceless)"
        phoneme: "TH"
        from: "th"
        to: "θ"
        examples:
          - { before: "thin",     after: "θin" }
          - { before: "math",     after: "maθ" }
          - { before: "path",     after: "paθ" }
          - { before: "thought",  after: "θout" }
          - { before: "thumb",    after: "θum" }
        exceptions:
          - { word: "this",   reason: "th aligns to /DH/ (voiced)" }
          - { word: "mother", reason: "th aligns to /DH/" }

      - name: "th→ð (voiced)"
        phoneme: "DH"
        from: "th"
        to: "ð"
        examples:
          - { before: "this",    after: "ðis" }
          - { before: "that",    after: "ðat" }
          - { before: "the",     after: "ðə" }
          - { before: "mother",  after: "moðer" }
          - { before: "smooth",  after: "smuːð" }
        exceptions:
          - { word: "thin",   reason: "th aligns to /TH/ (voiceless)" }
          - { word: "math",   reason: "th aligns to /TH/" }
