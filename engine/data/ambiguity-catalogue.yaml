version: 0.2
description: >
  Nayana ambiguity catalogue (runtime). Rules are grouped into phases.
  At phase N, rules from phases 1..N are applied cumulatively.

  Each rule has:
    name        — human-readable identifier
    phoneme     — the ARPAbet phoneme this rule resolves (uppercase, no
                  stress digit; e.g. "F", "K", "S", "AE")
    from        — the grapheme (letters) to replace
    to          — the canonical grapheme it becomes

  The engine fires a rule when, in the word's grapheme→phoneme alignment,
  some pair has `graphemes == from` AND `phoneme` appears in that pair's
  phonemes. This positional check prevents over-application:
    - "shepherd" — `ph` is split as p}P h}_ in the alignment, no pair
      has graphemes "ph", so ph→f does not fire.
    - "cycle"    — first c aligns to S, second to K, so c→s fires once
      and c→k fires once in the same word, in the right positions.

phases:
  - number: 1
    name: "ph → f"
    description: "The 'ph' digraph becomes 'f' wherever it spells the /f/ sound."
    rationale: >
      High-frequency, clean rule. About 12% of /f/-spellings use 'ph'.
      Exceptions (like 'shepherd') are handled by the alignment check:
      'shepherd' aligns as p}P h}_, so no pair has graphemes "ph".
    demoText: |
      A young girl asked the philosopher about his work. The philosopher said: I study philosophy. The girl wrote it in her journal as "filosafi". The philosopher smiled — she had captured the phonetic truth that English spelling hides. Even the elephant in the photograph knows: phone the shepherd to ask, and he will graph the answer for you.
    rules:
      - name: "ph→f"
        phoneme: "F"
        from: "ph"
        to: "f"
        examples:
          - { before: "philosophy",  after: "filosofy" }
          - { before: "phone",       after: "fone" }
          - { before: "graph",       after: "graf" }
          - { before: "elephant",    after: "elefant" }
        exceptions:
          - { word: "shepherd", reason: "h is silent (no aligned ph→F pair)" }
          - { word: "uphold",   reason: "p and h align separately, no ph pair" }

  - number: 2
    name: "c → k or s"
    description: "Resolves the c-ambiguity: c becomes k or s based on its sound."
    rationale: >
      The letter c has no inherent sound — it borrows /k/ or /s/ depending on
      the following letter, with frequent exceptions (cello /tʃ/, ocean /ʃ/,
      Celtic /k/ despite preceding e, facade /s/ despite preceding a).
      Position-based alignment lets us follow pronunciation, not the spelling
      rule. The cc digraph aligns as a single grapheme and almost always to
      /k/ (account, accord, occur), so we add an explicit cc→k rule.
    demoText: |
      A young girl asked the philosopher about his work. The philosopher said: I study philosophy. The girl wrote it in her journal as "filosafi". The philosopher smiled — she had captured the phonetic truth that English spelling hides. Even the elephant in the photograph knows: phone the shepherd to ask, and he will graph the answer for you.

      The next morning, a Celtic shepherd from the city walked uphill carrying a cello. He sat beside the ocean, opened an account in his journal, and wrote of cats and cycles and the facade of every cliff he could climb.
    rules:
      - name: "c→k"
        phoneme: "K"
        from: "c"
        to: "k"
        examples:
          - { before: "cat",     after: "kat" }
          - { before: "Celtic",  after: "Keltik" }
        exceptions:
          - { word: "cello",     reason: "c aligns to /tʃ/, not /k/ or /s/" }
          - { word: "ocean",     reason: "c aligns to /ʃ/" }

      - name: "c→s"
        phoneme: "S"
        from: "c"
        to: "s"
        examples:
          - { before: "city",    after: "sity" }
          - { before: "facade",  after: "fasade" }
        exceptions:
          - { word: "cello",     reason: "c aligns to /tʃ/" }

      - name: "cc→k"
        phoneme: "K"
        from: "cc"
        to: "k"
        examples:
          - { before: "account", after: "akount" }
          - { before: "accord",  after: "akord" }
        notes: >
          Phonetisaurus aligns 'cc' as a single grapheme token (e.g.
          c|c}K). This rule targets that token specifically. The c→k rule
          would not fire on cc because its graphemes don't equal "c".

  - number: 3
    name: "ck → k"
    description: "The 'ck' digraph collapses to 'k' wherever it spells /k/."
    rationale: >
      English uses 'ck' to mark a preceding short vowel — a spelling
      convention with no phonetic content. The /k/ is just /k/. Phonetisaurus
      aligns 'ck' as a single grapheme c|k}K in essentially every word it
      appears in (back, pick, sock, jacket, rocket), so this is one of the
      cleanest possible rules with virtually no exceptions.
    rules:
      - name: "ck→k"
        phoneme: "K"
        from: "ck"
        to: "k"
        examples:
          - { before: "back",    after: "bak" }
          - { before: "pick",    after: "pik" }
          - { before: "clock",   after: "klok" }
          - { before: "jacket",  after: "jaket" }
          - { before: "rocket",  after: "roket" }
        notes: >
          Combines naturally with phase 2: 'clock' aligns as c}K l}L
          o}AA1 ck}K, so c→k fires once and ck→k fires once,
          producing 'klok'.
    demoText: |
      A young girl asked the philosopher about his work. The philosopher said: I study philosophy. The girl wrote it in her journal as "filosafi". The philosopher smiled — she had captured the phonetic truth that English spelling hides. Even the elephant in the photograph knows: phone the shepherd to ask, and he will graph the answer for you.

      The next morning, a Celtic shepherd from the city walked uphill carrying a cello. He sat beside the ocean, opened an account in his journal, and wrote of cats and cycles and the facade of every cliff he could climb.

      In the afternoon, the children kicked a black ball back and forth in the park. They ducked behind the broken clock, laughed at every tick of every second, and dared each other to climb the rocket statue. One wore a yellow jacket, another carried a stuffed duck, and the smallest stuffed pickles into the pocket of her backpack.

  - number: 4
    name: "silent letters (kn → n, wr → r, mb → m)"
    description: "Silent letters in three common digraphs are dropped when alignment shows the letter is unpronounced."
    rationale: >
      The k in 'knife', the w in 'write', and the b in 'climb' are silent —
      historical residue from older English spellings. The pronunciation
      doesn't include them; the spelling pretends it does. Phonetisaurus
      aligns each digraph to a single phoneme (kn→/N/, wr→/R/, mb→/M/),
      so we can drop the silent letter cleanly. A nice side effect is
      that some homophones long obscured by spelling reunite: 'knew'
      becomes 'new', 'wrap' becomes 'rap', 'wrote' becomes 'rote'.
      ('know' becomes 'now' — a visual collision but not a true match,
      because Phonetisaurus keeps the 'ow' digraph. Later vowel phases
      will resolve this.) The alignment also distinguishes silent from
      pronounced cases: 'plumber' aligns mb→/M/ (rule fires) while
      'number' aligns m}M b}B separately (rule does not fire).
    rules:
      - name: "kn→n"
        phoneme: "N"
        from: "kn"
        to: "n"
        examples:
          - { before: "knife",   after: "nife" }
          - { before: "knock",   after: "nok" }
          - { before: "know",    after: "no" }
          - { before: "knight",  after: "night" }
        exceptions:
          - { word: "acknowledge", reason: "k aligns with the preceding ck, not with n" }

      - name: "wr→r"
        phoneme: "R"
        from: "wr"
        to: "r"
        examples:
          - { before: "write",   after: "rite" }
          - { before: "wrong",   after: "rong" }
          - { before: "wrist",   after: "rist" }
          - { before: "playwright", after: "playright" }

      - name: "mb→m"
        phoneme: "M"
        from: "mb"
        to: "m"
        examples:
          - { before: "comb",    after: "com" }
          - { before: "lamb",    after: "lam" }
          - { before: "climb",   after: "clim" }
          - { before: "plumber", after: "plumer" }
        exceptions:
          - { word: "number",  reason: "b is pronounced; alignment is m}M b}B, no mb pair" }
          - { word: "lumber",  reason: "b is pronounced" }
          - { word: "member",  reason: "b is pronounced" }
    demoText: |
      A young girl asked the philosopher about his work. The philosopher said: I study philosophy. The girl wrote it in her journal as "filosafi". The philosopher smiled — she had captured the phonetic truth that English spelling hides. Even the elephant in the photograph knows: phone the shepherd to ask, and he will graph the answer for you.

      The next morning, a Celtic shepherd from the city walked uphill carrying a cello. He sat beside the ocean, opened an account in his journal, and wrote of cats and cycles and the facade of every cliff he could climb.

      In the afternoon, the children kicked a black ball back and forth in the park. They ducked behind the broken clock, laughed at every tick of every second, and dared each other to climb the rocket statue. One wore a yellow jacket, another carried a stuffed duck, and the smallest stuffed pickles into the pocket of her backpack.

      That evening, the plumber climbed up to the broken pipe. He tied a knot in the rope, wrapped a wreath around his wrist for luck, and wrote down what he saw. The shepherd's lamb had wandered into the wrong tomb again, and the knight on the wall painting just stared with his thumb on the hilt of his knife.

  - number: 5
    name: "the long-i family — i/y → ai, gh dropped or → f"
    description: "Mark the /aɪ/ diphthong (night, my, find), drop silent gh (through, light), and turn the /f/-sounding gh into f (laugh, tough)."
    rationale: >
      The long-i diphthong /aɪ/ has been hiding under bare letters: the i
      in 'night' is the same vowel as the y in 'my', but English spelling
      gives no clue. Phase 5 makes it visible — both spellings become 'ai',
      so 'night' goes to 'nait' and 'my' goes to 'mai'. Short-i words
      (nit, bit, sit) are untouched because their phoneme is /ɪ/, not /aɪ/.
      Vowel-y unification also delivers on the project rule that y is
      consonant-only: vowel uses of y (sky, why, type) become the
      appropriate vowel glyph, while consonant y (yes, yellow) keeps its /j/.

      Silent gh is dropped (night, light, through, bought, straight) and
      /f/-sounding gh becomes f (laugh, tough, enough, rough). These two
      cleanups are bundled with the vowel rule for one reason: doing
      gh-removal alone would yield 'nit', 'lit', 'brit' — visually colliding
      with the unrelated /ɪ/ words. The vowel rule fires in the same phase
      so the reader never sees that collision.

      The deletion case is the project's first use of an epsilon rule:
      phoneme is null in the YAML, which the engine interprets as "fires
      when the pair has no phonemes." Words like 'ghost' are unaffected
      because Phonetisaurus splits them as g}G h}∅ (no 'gh' pair exists).
      Bonus unification: 'straight' and 'strait' merge — both /streɪt/.
    rules:
      - name: "i→ai (when /aɪ/)"
        phoneme: "AY"
        from: "i"
        to: "ai"
        examples:
          - { before: "find",    after: "faind" }
          - { before: "child",   after: "chaild" }
          - { before: "mighty",  after: "maity" }
          - { before: "die",     after: "daie" }
        exceptions:
          - { word: "nit",  reason: "i aligns to /IH/ (short-i), not /AY/" }
          - { word: "sit",  reason: "i aligns to /IH/" }

      - name: "y→ai (when /aɪ/)"
        phoneme: "AY"
        from: "y"
        to: "ai"
        examples:
          - { before: "my",     after: "mai" }
          - { before: "sky",    after: "skai" }
          - { before: "fly",    after: "flai" }
          - { before: "type",   after: "taipe" }
        exceptions:
          - { word: "yes",     reason: "y is consonant /j/, phoneme is Y not AY" }
          - { word: "happy",   reason: "y aligns to /IY/ (the 'ee' sound), not /AY/" }

      - name: "gh→∅"
        phoneme: null
        from: "gh"
        to: ""
        examples:
          - { before: "night",    after: "nait" }
          - { before: "through",  after: "throu" }
          - { before: "though",   after: "thou" }
          - { before: "bought",   after: "bout" }
          - { before: "straight", after: "strait" }
        exceptions:
          - { word: "ghost",    reason: "alignment is g}G h}∅; no 'gh' pair to match" }
          - { word: "spaghetti", reason: "alignment is g}G h}∅; no 'gh' pair to match" }
        notes: >
          First epsilon rule in the catalogue. The engine fires this on
          any pair where graphemes equal 'gh' AND phonemes is empty.

      - name: "gh→f"
        phoneme: "F"
        from: "gh"
        to: "f"
        examples:
          - { before: "laugh",    after: "lauf" }
          - { before: "tough",    after: "touf" }
          - { before: "enough",   after: "enouf" }
          - { before: "rough",    after: "rouf" }
    demoText: |
      A young girl asked the philosopher about his work. The philosopher said: I study philosophy. The girl wrote it in her journal as "filosafi". The philosopher smiled — she had captured the phonetic truth that English spelling hides. Even the elephant in the photograph knows: phone the shepherd to ask, and he will graph the answer for you.

      The next morning, a Celtic shepherd from the city walked uphill carrying a cello. He sat beside the ocean, opened an account in his journal, and wrote of cats and cycles and the facade of every cliff he could climb.

      In the afternoon, the children kicked a black ball back and forth in the park. They ducked behind the broken clock, laughed at every tick of every second, and dared each other to climb the rocket statue. One wore a yellow jacket, another carried a stuffed duck, and the smallest stuffed pickles into the pocket of her backpack.

      That evening, the plumber climbed up to the broken pipe. He tied a knot in the rope, wrapped a wreath around his wrist for luck, and wrote down what he saw. The shepherd's lamb had wandered into the wrong tomb again, and the knight on the wall painting just stared with his thumb on the hilt of his knife.

      Through the night, by the light of a single bright lantern, the daughter of the plumber sat at the table and laughed at the tough riddles her father bought home from the market. She was eight, my child, and high on her own brightness. She would try to fly, find every rhyme in the sky, and cry only when the type of question stumped her. She thought the world was straight, and her father did not have the heart to tell her enough to think otherwise.

  - number: 6
    name: "the long-a family — a/ay/ai/ey → ei, silent e dropped"
    description: "Mark the /eɪ/ diphthong wherever it hides (face, make, day, rain, they), and remove the silent e that propped up those spellings."
    rationale: >
      The long-a /eɪ/ sound is the most fragmented vowel in English
      orthography — it hides under five different spellings: 'a' alone
      (face, make), 'ay' (day, play), 'ai' (rain, train), 'ey' (they, grey),
      and the silent-leading-e construction (great, break). All five
      converge to 'ei' in Nayana. Bundled with this is the silent-e rule
      (e → ∅ when its phoneme list is empty) — without it, 'face' would
      become 'feise' or 'feic', leaving a useless trailing letter.
      Silent-e also fires mid-word where Phonetisaurus marks an e as
      truly silent ('interesting' → 'intresting'), which matches how
      English speakers actually say those words.
      The alignment correctly distinguishes pronounced-e from silent-e:
      'be', 'he', 'recipe' all keep their final e because the phoneme is
      /IY/ or /EY/, not empty. 'said' and 'again' keep their 'ai'
      because the phoneme is /EH/, not /EY/. 'money' and 'key' have
      e}∅ y}IY (separate pairs, not an 'ey' digraph), so silent-e
      drops the e and the y waits for a future vowel-y phase.
    rules:
      - name: "a→ei (when /eɪ/)"
        phoneme: "EY"
        from: "a"
        to: "ei"
        examples:
          - { before: "make",   after: "meik" }
          - { before: "paper",  after: "peiper" }
          - { before: "table",  after: "teibl" }
          - { before: "data",   after: "deita" }
        exceptions:
          - { word: "cat",    reason: "a aligns to /AE/, not /EY/" }
          - { word: "about",  reason: "a aligns to /AH/ (schwa)" }
          - { word: "call",   reason: "a aligns to /AO/" }

      - name: "ay→ei (when /eɪ/)"
        phoneme: "EY"
        from: "ay"
        to: "ei"
        examples:
          - { before: "day",   after: "dei" }
          - { before: "play",  after: "plei" }
          - { before: "way",   after: "wei" }

      - name: "ai→ei (when /eɪ/)"
        phoneme: "EY"
        from: "ai"
        to: "ei"
        examples:
          - { before: "rain",   after: "rein" }
          - { before: "train",  after: "trein" }
          - { before: "paint",  after: "peint" }
        exceptions:
          - { word: "said",    reason: "ai aligns to /EH/, not /EY/" }
          - { word: "again",   reason: "ai aligns to /EH/" }

      - name: "ey→ei (when /eɪ/)"
        phoneme: "EY"
        from: "ey"
        to: "ei"
        examples:
          - { before: "they",  after: "thei" }
          - { before: "grey",  after: "grei" }
          - { before: "prey",  after: "prei" }
        exceptions:
          - { word: "money",   reason: "alignment is e}∅ y}IY — separate pairs, not an 'ey' digraph" }
          - { word: "key",     reason: "alignment is e}∅ y}IY" }

      - name: "e→∅"
        phoneme: null
        from: "e"
        to: ""
        examples:
          - { before: "face",     after: "feis" }
          - { before: "give",     after: "giv" }
          - { before: "table",    after: "teibl" }
          - { before: "great",    after: "greit" }
        exceptions:
          - { word: "be",      reason: "e is pronounced (e}IY)" }
          - { word: "she",     reason: "e is pronounced" }
          - { word: "recipe",  reason: "final e is pronounced (e}IY)" }
        notes: >
          The project's second epsilon rule (after gh→∅ in phase 5).
          Fires on any pair where graphemes equal 'e' AND phonemes is
          empty — terminal silent e (face, give), silent leading e
          (great, break), and mid-word silent e (interesting).
    demoText: |
      A young girl asked the philosopher about his work. The philosopher said: I study philosophy. The girl wrote it in her journal as "filosafi". The philosopher smiled — she had captured the phonetic truth that English spelling hides. Even the elephant in the photograph knows: phone the shepherd to ask, and he will graph the answer for you.

      The next morning, a Celtic shepherd from the city walked uphill carrying a cello. He sat beside the ocean, opened an account in his journal, and wrote of cats and cycles and the facade of every cliff he could climb.

      In the afternoon, the children kicked a black ball back and forth in the park. They ducked behind the broken clock, laughed at every tick of every second, and dared each other to climb the rocket statue. One wore a yellow jacket, another carried a stuffed duck, and the smallest stuffed pickles into the pocket of her backpack.

      That evening, the plumber climbed up to the broken pipe. He tied a knot in the rope, wrapped a wreath around his wrist for luck, and wrote down what he saw. The shepherd's lamb had wandered into the wrong tomb again, and the knight on the wall painting just stared with his thumb on the hilt of his knife.

      Through the night, by the light of a single bright lantern, the daughter of the plumber sat at the table and laughed at the tough riddles her father bought home from the market. She was eight, my child, and high on her own brightness. She would try to fly, find every rhyme in the sky, and cry only when the type of question stumped her. She thought the world was straight, and her father did not have the heart to tell her enough to think otherwise.

      The next day, the same child made her way back to the lake. She came face to face with a great crane that took flight in the rain. She gave it a name — Grey — and stayed away from the train tracks where it played. They became friends. Each day she made her way to the same place, where the crane would wait by the gate.

  - number: 7
    name: "the o-family — o/ow → ou, ow/ou → au, silent a/u/h dropped"
    description: "Mark both o-diphthongs: /oʊ/ becomes 'ou' (go → gou, boat → bout, snow → snou) and /aʊ/ becomes 'au' (cow → kau, about → abaut). Silent a, u, and h are dropped along the way."
    rationale: >
      The two o-diphthongs share spellings in English: 'ow' is /oʊ/ in
      'snow' but /aʊ/ in 'cow'; 'ou' is /aʊ/ in 'about' but appears in
      many other guises. Phase 7 makes them visually distinct: /oʊ/ →
      ou and /aʊ/ → au, so 'boat' becomes 'bout' and 'bout' becomes
      'baut' — no collision. We do both in the same phase because doing
      /oʊ/ alone would land 'boat' on 'bout', colliding with the
      unrelated /aʊ/ word. Mirror of the bundling pattern from phases
      5 and 6.

      Silent-a, silent-u, and silent-h rules ride along because the
      alignment reveals them as the cleanup needed to make the vowel
      rules read cleanly: 'boat' aligns as o}OW1 a}∅ t}T, so dropping
      silent a is what gets us from 'bouat' to 'bout'. Silent-u handles
      soul/dough/though/build/tongue. Silent-h handles hour, honest,
      honor, herb, ghost, and the wh-words (what, where, when, why).

      Notable unifications: our and hour both land on 'aur' (true
      homophones in English). soul keeps its spelling — the alignment
      makes o the vowel and u silent, and the rules confirm that.
    rules:
      - name: "o→ou (when /oʊ/)"
        phoneme: "OW"
        from: "o"
        to: "ou"
        examples:
          - { before: "go",    after: "gou" }
          - { before: "old",   after: "ould" }
          - { before: "home",  after: "houm" }
          - { before: "boat",  after: "bout" }
        exceptions:
          - { word: "on",    reason: "o aligns to /AA/" }
          - { word: "dog",   reason: "o aligns to /AO/" }
          - { word: "do",    reason: "o aligns to /UW/" }
          - { word: "some",  reason: "o aligns to /AH/" }

      - name: "ow→ou (when /oʊ/)"
        phoneme: "OW"
        from: "ow"
        to: "ou"
        examples:
          - { before: "snow",   after: "snou" }
          - { before: "low",    after: "lou" }
          - { before: "below",  after: "belou" }
          - { before: "window", after: "windou" }

      - name: "ow→au (when /aʊ/)"
        phoneme: "AW"
        from: "ow"
        to: "au"
        examples:
          - { before: "cow",   after: "kau" }
          - { before: "how",   after: "hau" }
          - { before: "now",   after: "nau" }
          - { before: "town",  after: "taun" }

      - name: "ou→au (when /aʊ/)"
        phoneme: "AW"
        from: "ou"
        to: "au"
        examples:
          - { before: "about", after: "abaut" }
          - { before: "out",   after: "aut" }
          - { before: "sound", after: "saund" }
          - { before: "our",   after: "aur" }

      - name: "a→∅ (silent)"
        phoneme: null
        from: "a"
        to: ""
        examples:
          - { before: "boat",  after: "bout" }
          - { before: "road",  after: "roud" }
          - { before: "toast", after: "toust" }
        notes: >
          Targets the silent-a in o+a digraphs (boat, road, toast,
          coat, goal, foam) where Phonetisaurus aligns the a to no
          phoneme.

      - name: "u→∅ (silent)"
        phoneme: null
        from: "u"
        to: ""
        examples:
          - { before: "build",  after: "bild" }
          - { before: "tongue", after: "tong" }
          - { before: "soul",   after: "soul" }
        notes: >
          Drops the u in build/guest/tongue and the silent u after o
          in soul/dough/though. The gu digraph (guess, guard, guy,
          colleague) is safe — Phonetisaurus aligns it as a single
          grapheme gu}G, so the rule never sees a bare 'u' there.

      - name: "h→∅ (silent)"
        phoneme: null
        from: "h"
        to: ""
        examples:
          - { before: "hour",    after: "aur" }
          - { before: "honest",  after: "onest" }
          - { before: "ghost",   after: "gost" }
          - { before: "what",    after: "wat" }
          - { before: "where",   after: "wer" }
        notes: >
          Drops silent h: word-initial (hour, honest, honor, herb,
          heir), inside gh-clusters where g is pronounced (ghost,
          ghastly), and after w in wh-words (what, where, when, why).
    demoText: |
      A young girl asked the philosopher about his work. The philosopher said: I study philosophy. The girl wrote it in her journal as "filosafi". The philosopher smiled — she had captured the phonetic truth that English spelling hides. Even the elephant in the photograph knows: phone the shepherd to ask, and he will graph the answer for you.

