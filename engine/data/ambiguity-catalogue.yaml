      collide with short /ɪ/ words (it, bit, sit). 'eat' and 'it'
      would both spell 'it'. With 'iː', the long-vowel words become
      visibly distinct: 'eat' → 'iːt', 'meat' → 'miːt'. The marker
      uses the canonical IPA codepoint per the project's encoding rule.

