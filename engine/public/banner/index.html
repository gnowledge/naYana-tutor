<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>naYana — banner</title>
<style>
  @font-face {
    font-family: 'Nayana';
    src: url('/why/Nayana-Regular.otf') format('opentype');
    font-display: block;
  }
  @font-face {
    font-family: 'Comic Neue';
    src: url('/why/ComicNeue-Regular.otf') format('opentype');
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }

  body {
    /* 1920×1080 — LinkedIn-safe banner aspect (16:9). */
    width: 1920px;
    height: 1080px;
    background: #fbfbf7;
    color: #1d1d1b;
    font-family: 'Comic Neue', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;

    /* Subtle warm wash so the banner doesn't look flat */
    background:
      radial-gradient(ellipse at top, rgba(42, 111, 74, 0.04) 0%, transparent 60%),
      radial-gradient(ellipse at bottom, rgba(196, 122, 74, 0.04) 0%, transparent 60%),
      #fbfbf7;
  }

  /* Top-left brand mark */
  .brand {
    position: absolute;
    top: 56px;
    left: 80px;
    font-size: 22px;
    font-weight: 600;
    color: #2a6f4a;
    letter-spacing: 0.02em;
  }
  .brand .scope {
    font-weight: 400;
    color: #777;
    margin-left: 8px;
  }

  /* Top-right small tagline */
  .tagline {
    position: absolute;
    top: 56px;
    right: 80px;
    font-size: 18px;
    color: #888;
    font-style: italic;
  }

  /* Centre stage — the transformation */
  .stage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .transform-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 60px;
    margin-bottom: 24px;
  }

  .word {
    font-size: 180px;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .word.english {
    color: #999;
    font-weight: 400;
  }
  .word.nayana {
    font-family: 'Nayana', 'Comic Neue', sans-serif;
    font-feature-settings: "ss01" on, "liga" on;
    color: #1d1d1b;
  }

  .arrow {
    font-size: 100px;
    color: #2a6f4a;
    font-weight: 300;
    line-height: 1;
    position: relative;
    top: -10px;
  }

  .labels {
    display: flex;
    justify-content: center;
    gap: 60px;
    color: #888;
    font-size: 22px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .labels .l {
    /* widths roughly match the words above for column alignment */
    min-width: 480px;
    text-align: center;
  }

  /* Subtitle below stage */
  .subtitle {
    position: absolute;
    bottom: 220px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 38px;
    font-style: italic;
    color: #555;
    font-family: 'Comic Neue', serif;
  }

  /* Bottom strip */
  .bottom {
    position: absolute;
    bottom: 56px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #888;
    font-size: 20px;
  }
  .bottom .left {
    max-width: 60%;
  }
  .bottom .right {
    color: #2a6f4a;
    font-weight: 500;
  }

  /* Decorative rule across the middle, behind the stage */
  .rule {
    position: absolute;
    top: 50%;
    left: 80px;
    right: 80px;
    height: 1px;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(42, 111, 74, 0.15) 30%,
      rgba(42, 111, 74, 0.15) 70%,
      transparent 100%);
    z-index: -1;
  }
</style>
</head>
<body>

<div class="brand">naYana<span class="scope">for English</span></div>
<div class="tagline">a phased phonetic reform</div>

<div class="rule"></div>

<div class="stage">
  <div class="transform-row">
    <span class="word english">philosophy</span>
    <span class="arrow">→</span>
    <span class="word nayana">filosəfiː</span>
  </div>
  <div class="labels">
    <span class="l">English</span>
    <span class="l">naYana</span>
  </div>
</div>

<div class="subtitle">Returning time to the reader.</div>

<div class="bottom">
  <div class="left">An IPA-compliant script that lets you read phonetic English without years of phonetics training.</div>
  <div class="right">nayana.gnowledge.org</div>
</div>

</body>
</html>
